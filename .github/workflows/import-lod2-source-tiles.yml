name: Import Koelnmesse LoD2 source tiles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-lod2-source-tiles.yml

permissions:
  contents: write

jobs:
  import-lod2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify official LoD2 tiles
        shell: bash
        run: |
          set -euo pipefail

          destination="data/raw/lod2"
          source_base="https://www.opengeodata.nrw.de/produkte/geobasis/3dg/lod2_gml/lod2_gml"
          mkdir -p "$destination"

          tiles=(
            "LoD2_32_357_5645_1_NW.gml"
            "LoD2_32_357_5646_1_NW.gml"
            "LoD2_32_358_5645_1_NW.gml"
            "LoD2_32_358_5646_1_NW.gml"
          )

          declare -A expected_sha256=(
            ["LoD2_32_357_5645_1_NW.gml"]="f4851658f37bea69963541185644908acb57f097ba7ac7340d935a5214467239"
            ["LoD2_32_357_5646_1_NW.gml"]="f62689eabb9092bedbbd427fb3324a678e1197f5188295d2f5b8d71157ae41b3"
            ["LoD2_32_358_5645_1_NW.gml"]="8d35c61e101de3db94cd52fe0a9aad5a35ec2cbccdf40884ce61d426f8ac4ada"
            ["LoD2_32_358_5646_1_NW.gml"]="1b3916dfcd0361816b940a85490cd430e5a789c5cbccace7b2ece3627893ac66"
          )

          for tile in "${tiles[@]}"; do
            target="$destination/$tile"
            expected="${expected_sha256[$tile]}"

            if [[ -f "$target" ]] && echo "$expected  $target" | sha256sum --check --status; then
              echo "Already present and verified: $tile"
              continue
            fi

            url="$source_base/$tile"
            echo "Downloading $url"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --connect-timeout 20 \
              --output "$target.tmp" "$url"

            actual="$(sha256sum "$target.tmp" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Checksum mismatch for $tile" >&2
              echo "Expected: $expected" >&2
              echo "Actual:   $actual" >&2
              rm -f "$target.tmp"
              exit 1
            fi

            mv "$target.tmp" "$target"
            echo "Imported and verified: $tile"
          done

          echo "Verified source files:"
          for tile in "${tiles[@]}"; do
            sha256sum "$destination/$tile"
          done

      - name: Commit source tiles
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- data/raw/lod2)" ]]; then
            echo "No LoD2 changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/lod2/LoD2_32_357_5645_1_NW.gml
          git add -f data/raw/lod2/LoD2_32_357_5646_1_NW.gml
          git add -f data/raw/lod2/LoD2_32_358_5645_1_NW.gml
          git add -f data/raw/lod2/LoD2_32_358_5646_1_NW.gml
          git commit -m "data: add Koelnmesse LoD2 source tiles"
          git push
